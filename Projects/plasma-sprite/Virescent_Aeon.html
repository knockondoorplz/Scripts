<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Virescent Aeon — Algebraic Glyph Familiar</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      height: 100%;
      width: 100%;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #hud {
      position: fixed;
      right: 10px;
      top: 8px;
      padding: 4px 7px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 11px;
      color: rgba(220, 234, 255, 0.8);
      background: linear-gradient(180deg, rgba(8,10,18,0.78), rgba(6,8,16,0.55));
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(7px);
      pointer-events: none;
      z-index: 10;
      user-select: none;
    }
  </style>
</head>
<body>
  <canvas id="aeon"></canvas>
  <div id="hud">Aeon: observing · ℵ geometry · alive
  <br/>[1] edge  [2] wander  [3] geometry  [G] cycle  [H] hide HUD</div>

  <script>
  // ============================================================================
  // VIRESCENT AEON — Consolidated Master Version
  // Electric Sheep Fractal Body + Dual Monitor + Reflective Aura + Behaviors
  // ============================================================================

  const canvas = document.getElementById('aeon');
  const ctx = canvas.getContext('2d', { alpha: true });

  let W = window.innerWidth;
  let H = window.innerHeight;
  
  // NOW it's safe to create stars
  const stars = Array.from({length: 80}, () => ({
    x: Math.random()*W,
    y: Math.random()*H,
    r: Math.random()*1.5
  }));

  
  console.log("Window size:", window.innerWidth, window.innerHeight);
  console.log("Canvas size:", canvas.width, canvas.height);

  // ============================================================================
  // SETUP & RESIZE
  // ============================================================================

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  window.addEventListener('resize', () => {
    W = window.innerWidth;
    H = window.innerHeight;
    resize();
  });

  resize();

  // ============================================================================
  // CONSTANTS & UTILITIES
  // ============================================================================

  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;

  // Master glyph set
  const MASTER_GLYPHS = [
    "ᚠ","ᚢ","ᚦ","ᚨ","ᚱ","ᚲ","ᚹ","ᛉ","ᛋ","ᛏ","ᛒ","ᛗ","ᛟ","ᛞ","ᛝ","᚛","᚜",
    "۞","₪","✧","ᚾ","߷","౨","ᔑ","ﺝ","ﬡ","ꭍ","Ω","Σ","Ⰹ",
    "-","+","÷","x","z","!","?","0","1","%","#","°","æ","ƹ","ƨ","ʊ","ɔ","ə","ʢ","ʺ",
    "Δ","Φ","Ψ","π","ҩ","Պ","Հ","Ձ","Ճ","Յ","Չ","ل","ᴕ","ע","פ","ץ","צ","ᵹ","ᵶ","‽",
    "ꬽ","ꭅ","ꭥ","ꝋ","j","xy","n","∂","↓","∞","√","∙","∫","≠","≡","☼","▼","▲","☺","☻","►","◄","◌",
  ];
  const RUNES = MASTER_GLYPHS;
  const pickRune = () => RUNES[Math.floor(Math.random() * RUNES.length)];

  // ============================================================================
  // MOUSE TRACKING
  // ============================================================================

  const mouse = { x: W/2, y: H/2, lastMove: 0, deltaX: 0, deltaY: 0, seen: false };
  window.addEventListener('pointermove', e => {
    const oldX = mouse.x;
    const oldY = mouse.y;
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.deltaX = mouse.x - oldX;
    mouse.deltaY = mouse.y - oldY;
    mouse.lastMove = performance.now();
    mouse.seen = true;
  });

  window.addEventListener('mousedown', e => {
    // Trigger teleport or special event on click
    if (Math.random() < 0.3) {
      aeon.teleportTo(e.clientX, e.clientY);
    }
  });

  // ============================================================================
  // GLYPH PARTICLE SYSTEM
  // ============================================================================

  const glyphs = [];

  class GlyphParticle {
    constructor(x, y, baseHue) {
      this.x = x;
      this.y = y;
      this.vx = rand(-1.2, 1.2);
      this.vy = rand(-1.2, 1.2);
      this.life = rand(800, 2000);
      this.age = 0;
      this.rune = pickRune();
      this.spin = rand(0, TAU);
      this.baseHue = baseHue;
      this.size = rand(13, 22);
      this.spinSpeed = rand(-0.02, 0.02);
    }

    update(dt) {
      this.age += dt;
      const t = this.age / this.life;
      if (t >= 1) return false;

      this.spin += this.spinSpeed * dt * 60;
      this.x += this.vx * (1 - t * 0.3);
      this.y += this.vy * (1 - t * 0.3);

      // Slight magnetic drift
      this.vx += Math.cos(this.spin) * 0.008;
      this.vy += Math.sin(this.spin) * 0.008;

      return true;
    }

    draw(ctx) {
      const t = this.age / this.life;
      const alpha = (1 - t) * 0.85;

      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(Math.sin(this.spin * 0.3) * 0.4);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = `hsla(${this.baseHue + Math.sin(this.spin)*25}, 85%, 60%, ${alpha})`;
      ctx.font = `${this.size}px "Noto Sans Symbols 2", system-ui, serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(this.rune, 0, 0);
      ctx.restore();
    }
  }

  // ============================================================================
  // CORE ORGANISM — AEON
  // ============================================================================

  const aeon = {
    x: W / 2,
    y: H / 2,
    vx: 0,
    vy: 0,
    tail: [],
    tailLen: 45,
    glow: 1,
    mode: 'edge',
    geomMode: 'lemniscate',
    baseHue: 195,
    idlePhase: 0,
    dashing: false,
    lastDash: 0,
    excitement: 0,
    lastEventTime: 0,

    // Teleportation
    teleportTo(tx, ty) {
      this.x = tx;
      this.y = ty;
      this.dashing = false;
      this.excitement = 1.0;
      this.lastEventTime = performance.now();
      
      // Emit glyph burst
      for (let i = 0; i < 12; i++) {
        glyphs.push(new GlyphParticle(this.x, this.y, this.baseHue));
      }
    }
  };

  const geomModes = ['lemniscate', 'lissajous', 'spiral', 'orbit'];

  // ============================================================================
  // GEOMETRY FUNCTIONS
  // ============================================================================

  function geomPoint(mode, t) {
    const cx = W / 2;
    const cy = H / 2;

    if (mode === 'lemniscate') {
      const a = Math.sin(t * 0.8);
      const b = Math.cos(t * 0.8);
      const scale = Math.min(W, H) * 0.22;
      return {
        x: cx + scale * (a) / (1 + b*b),
        y: cy + scale * (a * b) / (1 + b*b)
      };
    }

    if (mode === 'lissajous') {
      const A = Math.min(W, H) * 0.28;
      const a = 3, b = 2, d = Math.PI / 2.4;
      return {
        x: cx + A * Math.sin(a * t * 0.5 + d),
        y: cy + A * Math.sin(b * t * 0.5)
      };
    }

    if (mode === 'spiral') {
      const s = t * 0.10;
      const r = (40 + s * 240) % (Math.min(W, H) * 0.40);
      const ang = s * 2.8;
      return { x: cx + Math.cos(ang)*r, y: cy + Math.sin(ang)*r };
    }

    // Orbit
    const R = Math.min(W, H) * 0.20;
    const ang = t * 0.8;
    const ox = mouse.seen ? mouse.x : cx;
    const oy = mouse.seen ? mouse.y : cy;
    return { x: ox + Math.cos(ang)*R, y: oy + Math.sin(ang)*R*0.7 };
  }

  function screenRect(pad = 50) {
    return { x: pad, y: pad, w: W - pad*2, h: H - pad*2 };
  }

  function perimeterPoint(rect, tNorm) {
    const { x, y, w, h } = rect;
    const per = 2*(w + h);
    let d = tNorm * per;
    if (d < w) return { x: x + d, y: y };
    d -= w;
    if (d < h) return { x: x + w, y: y + d };
    d -= h;
    if (d < w) return { x: x + w - d, y: y + h };
    d -= w;
    return { x: x, y: y + h - d };
  }

  // ============================================================================
  // UPDATE LOGIC
  // ============================================================================

  function update(dt, dtMs, now) {
    // Idle detection
    const idle = mouse.seen && (now - mouse.lastMove) > 6000;
    if (idle) {
      aeon.idlePhase = Math.min(1, aeon.idlePhase + dt * 0.3);
    } else {
      aeon.idlePhase = Math.max(0, aeon.idlePhase - dt * 0.5);
    }

    // Excitement decay
    aeon.excitement = Math.max(0, aeon.excitement - dt * 0.4);

    let target = null;

    // Behavioral weighting
    let edgeWeight = 0.5;
    let wanderWeight = 0.2;
    let geometryWeight = 0.1;

    // Modulate based on state
    if (idle) {
      geometryWeight = 0.6;
      edgeWeight = 0.2;
      wanderWeight = 0.4;
    } else {
      edgeWeight = 0.7;
      wanderWeight = 0.15;
    }

    // Compute targets
    const rect = screenRect(50 + Math.sin(now * 0.0002) * 15);
    const tNorm = (now * 0.00005 * (1 + aeon.idlePhase * 0.5)) % 1;
    const edgeTarget = perimeterPoint(rect, tNorm);
    const wanderTarget = aeon._wanderTarget || { x: W/2, y: H/2 };
    const geomTarget = geomPoint(aeon.geomMode, now * 0.00055);

    if (!aeon._wanderTarget || Math.random() < 0.005) {
      aeon._wanderTarget = {
        x: rand(W * 0.1, W * 0.9),
        y: rand(H * 0.1, H * 0.9)
      };
    }

    // Blend targets
    if (edgeWeight + wanderWeight + geometryWeight > 0) {
      const totalWeight = edgeWeight + wanderWeight + geometryWeight;
      target = {
        x: (edgeTarget.x * edgeWeight + wanderTarget.x * wanderWeight + geomTarget.x * geometryWeight) / totalWeight,
        y: (edgeTarget.y * edgeWeight + wanderTarget.y * wanderWeight + geomTarget.y * geometryWeight) / totalWeight
      };
    }

    // Cursor interaction
    if (mouse.seen) {
      const d = Math.hypot(aeon.x - mouse.x, aeon.y - mouse.y);

      // Peek behind cursor
      if (d < 150 && !aeon.dashing) {
        const peekBehind = {
          x: mouse.x - mouse.deltaX * 4,
          y: mouse.y - mouse.deltaY * 4
        };
        target = peekBehind;
      }

      // Dash on sharp mouse movement
      if (!aeon.dashing && d > 250 && Math.hypot(mouse.deltaX, mouse.deltaY) > 25 && Math.random() < 0.03) {
        aeon.dashing = true;
        aeon.lastDash = now;
        aeon.excitement = 0.8;
        aeon.lastEventTime = now;

        const dx = mouse.x - aeon.x;
        const dy = mouse.y - aeon.y;
        const dist = Math.hypot(dx, dy) || 1;
        aeon.vx = (dx / dist) * 280;
        aeon.vy = (dy / dist) * 280;

        // Emit glyph burst on dash
        for (let i = 0; i < 8; i++) {
          glyphs.push(new GlyphParticle(aeon.x, aeon.y, aeon.baseHue));
        }
      }
    }

    if (aeon.dashing && now - aeon.lastDash > 400) {
      aeon.dashing = false;
    }

    // Smooth movement
    if (target) {
      const dx = target.x - aeon.x;
      const dy = target.y - aeon.y;
      const dist = Math.hypot(dx, dy) || 1;
      
      const speedBase = 45 + aeon.excitement * 80; // Slower base
      const speed = speedBase * (aeon.dashing ? 2.0 : 1.0) * (1 + aeon.idlePhase * 0.4);
      
      const desiredVx = (dx / dist) * speed;
      const desiredVy = (dy / dist) * speed;
      
      const mix = clamp(2 * dt * (0.8 + aeon.idlePhase * 0.5), 0.03, 0.25);
      aeon.vx = lerp(aeon.vx, desiredVx, mix);
      aeon.vy = lerp(aeon.vy, desiredVy, mix);
    } else {
      aeon.vx = lerp(aeon.vx, rand(-15, 15), 0.02);
      aeon.vy = lerp(aeon.vy, rand(-15, 15), 0.02);
    }

    aeon.x += aeon.vx * dt;
    aeon.y += aeon.vy * dt;

    // Wrapping
    if (aeon.x < -50) aeon.x = W + 50;
    if (aeon.x > W + 50) aeon.x = -50;
    if (aeon.y < -50) aeon.y = H + 50;
    if (aeon.y > H + 50) aeon.y = -50;

    // Glow modulation
    const targetGlow = aeon.dashing ? 2.2 : (idle ? 1.4 : 0.95);
    aeon.glow = lerp(aeon.glow, targetGlow, dt * 3.0);

    // Tail update
    aeon.tail.unshift({ x: aeon.x, y: aeon.y, t: now });
    while (aeon.tail.length > aeon.tailLen) aeon.tail.pop();

    // Update glyphs
    for (let i = glyphs.length - 1; i >= 0; i--) {
      const alive = glyphs[i].update(dtMs);
      if (!alive) glyphs.splice(i, 1);
    }
  }

  // ============================================================================
  // RENDERING — ELECTRIC SHEEP BODY
  // ============================================================================

  function drawElectricSheepBody(now) {
    const baseR = 28 + aeon.glow * 10;
    const time = now * 0.0008;

    ctx.save();
    ctx.translate(aeon.x, aeon.y);
    ctx.globalCompositeOperation = 'lighter';

    // Outer glow/aura
    const auraGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, baseR * 4);
    auraGrad.addColorStop(0, `hsla(${aeon.baseHue}, 100%, 75%, ${0.4 * aeon.glow})`);
    auraGrad.addColorStop(0.4, `hsla(${aeon.baseHue + 15}, 95%, 55%, ${0.2 * aeon.glow})`);
    auraGrad.addColorStop(1, `hsla(${aeon.baseHue + 30}, 80%, 30%, ${0.05 * aeon.glow})`);
    ctx.fillStyle = auraGrad;
    ctx.beginPath();
    ctx.arc(0, 0, baseR * 3.5, 0, TAU);
    ctx.fill();

    // Main plasma body with electric sheep fractal distortion
    ctx.beginPath();
    for (let i = 0; i < 180; i++) {
      const a = (i / 180) * TAU;
      
      // Multi-layered noise for fractal complexity
      const n1 = Math.sin(a * 3 + time) * 0.35;
      const n2 = Math.sin(a * 7 - time * 0.7) * 0.25;
      const n3 = Math.sin(a * 13 + time * 1.3) * 0.15;
      const n4 = Math.cos(a * 5 - time * 0.5) * 0.2;
      
      const totalNoise = n1 + n2 + n3 + n4;
      const r = baseR * (1.1 + totalNoise * 0.7);

      const px = Math.cos(a) * r;
      const py = Math.sin(a) * r;

      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = `hsla(${aeon.baseHue + 8}, 92%, 62%, ${0.55 * aeon.glow})`;
    ctx.fill();

    // Inner shimmering core
    const coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, baseR * 0.8);
    coreGrad.addColorStop(0, `hsla(${aeon.baseHue + 20}, 100%, 80%, ${0.7 * aeon.glow})`);
    coreGrad.addColorStop(1, `hsla(${aeon.baseHue}, 90%, 50%, ${0.3 * aeon.glow})`);
    ctx.fillStyle = coreGrad;
    ctx.beginPath();
    ctx.arc(0, 0, baseR * 0.9, 0, TAU);
    ctx.fill();

    ctx.restore();
  }

  function drawReflectiveAura(now) {
    const baseR = 28 + aeon.glow * 10;

    ctx.save();
    ctx.globalCompositeOperation = 'screen';

    // Chromatic separation effect
    const offset = Math.sin(now * 0.001) * 3;

    // Red channel
    ctx.globalAlpha = 0.15 * aeon.glow;
    const redGrad = ctx.createRadialGradient(
      aeon.x - offset, aeon.y, 0,
      aeon.x - offset, aeon.y, baseR * 4
    );
    redGrad.addColorStop(0, 'rgba(255, 100, 100, 0.6)');
    redGrad.addColorStop(1, 'rgba(255, 100, 100, 0)');
    ctx.fillStyle = redGrad;
    ctx.beginPath();
    ctx.arc(aeon.x - offset, aeon.y, baseR * 4, 0, TAU);
    ctx.fill();

    // Blue channel
    ctx.globalAlpha = 0.15 * aeon.glow;
    const blueGrad = ctx.createRadialGradient(
      aeon.x + offset, aeon.y, 0,
      aeon.x + offset, aeon.y, baseR * 4
    );
    blueGrad.addColorStop(0, 'rgba(100, 150, 255, 0.6)');
    blueGrad.addColorStop(1, 'rgba(100, 150, 255, 0)');
    ctx.fillStyle = blueGrad;
    ctx.beginPath();
    ctx.arc(aeon.x + offset, aeon.y, baseR * 4, 0, TAU);
    ctx.fill();

    ctx.restore();
  }

  function drawTail(now) {
    if (aeon.tail.length < 2) return;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    // Luminous trail
    ctx.beginPath();
    for (let i = 0; i < aeon.tail.length; i++) {
      const t = aeon.tail[i];
      const age = now - t.t;
      const alpha = Math.max(0, 1 - age / 2000) * 0.6;

      ctx.globalAlpha = alpha;
      if (i === 0) ctx.moveTo(t.x, t.y);
      else ctx.lineTo(t.x, t.y);
    }
    ctx.strokeStyle = `hsla(${aeon.baseHue}, 80%, 55%, 0.8)`;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();

    // Smoke/liquid effect on tail
    for (let i = 0; i < aeon.tail.length; i += 3) {
      const t = aeon.tail[i];
      const age = now - t.t;
      const alpha = Math.max(0, (1 - age / 2000) * 0.15);

      ctx.globalAlpha = alpha;
      const smokeGrad = ctx.createRadialGradient(t.x, t.y, 0, t.x, t.y, 15);
      smokeGrad.addColorStop(0, `hsla(${aeon.baseHue}, 85%, 60%, ${alpha})`);
      smokeGrad.addColorStop(1, `hsla(${aeon.baseHue}, 70%, 40%, 0)`);
      ctx.fillStyle = smokeGrad;
      ctx.beginPath();
      ctx.arc(t.x, t.y, 15, 0, TAU);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawTemporalAliasingEffect(now) {
    if (aeon.excitement < 0.3) return;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    // Stutter/repeat effect from tail memory
    const stutter = Math.sin(now * 0.02) * aeon.excitement;
    if (Math.abs(stutter) > 0.5 && Math.random() < 0.3) {
      for (let i = 5; i < Math.min(15, aeon.tail.length); i += 2) {
        const t = aeon.tail[i];
        const offset = Math.sin(now * 0.005 + i) * 20 * aeon.excitement;

        ctx.globalAlpha = 0.25 * aeon.excitement;
        ctx.fillStyle = `hsla(${aeon.baseHue + 15}, 90%, 65%, ${0.4 * aeon.excitement})`;
        ctx.beginPath();
        ctx.arc(t.x + offset, t.y + offset * 0.5, 12, 0, TAU);
        ctx.fill();
      }
    }

    ctx.restore();
  }

  function drawScreenBands(now) {
    if (aeon.idlePhase < 0.25) return;
    if (Math.random() < 0.85) return; // Very rare

    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = 0.08 * aeon.idlePhase;

    const bandCount = Math.floor(rand(1, 4));
    for (let i = 0; i < bandCount; i++) {
      const y = rand(0, H);
      const height = rand(3, 8);
      ctx.fillStyle = `rgba(180, 220, 255, 0.3)`;
      ctx.fillRect(0, y, W, height);
    }

    ctx.restore();
  }

  function drawCrackedGlassPrism(x, y, size) {
    const shards = Math.floor(rand(4, 9));
    const baseHue = rand(200, 240);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    for (let i = 0; i < shards; i++) {
      const angle = rand(0, TAU);
      const radius = rand(size * 0.3, size);
      const angle2 = angle + rand(0.1, 0.6);

      const x1 = x + Math.cos(angle) * radius;
      const y1 = y + Math.sin(angle) * radius;
      const x2 = x + Math.cos(angle2) * radius * 0.7;
      const y2 = y + Math.sin(angle2) * radius * 0.7;

      ctx.strokeStyle = `hsla(${baseHue}, 85%, 65%, ${rand(0.3, 0.7)})`;
      ctx.lineWidth = rand(1.5, 3);
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.closePath();
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawSwirlingManifold(ctx, aeon, now) {
    const baseR = 26 + aeon.glow * 7;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    // Outer glowing plasma with dynamic color transitions
    let grd = ctx.createRadialGradient(aeon.x, aeon.y, 0, aeon.x, aeon.y, baseR * 3.5);
    grd.addColorStop(0, `hsla(${(aeon.baseHue + now * 0.02) % 360}, 96%, 92%, ${0.85 * aeon.glow})`);
    grd.addColorStop(0.4, `hsla(${(aeon.baseHue - 20 + now * 0.02) % 360}, 90%, 70%, ${0.4 * aeon.glow})`);
    grd.addColorStop(1, `hsla(${(aeon.baseHue - 60 + now * 0.02) % 360}, 70%, 30%, ${0.1 * aeon.glow})`);
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(aeon.x, aeon.y, baseR * 2, 0, TAU);
    ctx.fill();

    // Advanced parametric Möbius knot or infinity symbol
    ctx.beginPath();
    const segments = 120;
    for (let i = 0; i < segments; i++) {
      const t = (i / segments) * TAU;
      const radius = baseR * (1 + 0.3 * Math.sin(3 * t + aeon.idlePhase));
      const z = Math.sin(t * 2 + now * 0.003) * 10; // Simulate Z-axis depth
      const px = aeon.x + Math.cos(t) * radius;
      const py = aeon.y + Math.sin(t) * radius + z;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.strokeStyle = `hsla(${(aeon.baseHue + 50 + now * 0.02) % 360}, 90%, 65%, ${0.55 * aeon.glow})`;
    ctx.lineWidth = 2;
    ctx.stroke();

    // Inner rotating core for depth illusion
    ctx.beginPath();
    const coreRadius = baseR * 0.5 * (1 + 0.1 * Math.sin(now * 0.01));
    ctx.arc(aeon.x, aeon.y, coreRadius, 0, TAU);
    ctx.fillStyle = `hsla(${(aeon.baseHue + 80 + now * 0.02) % 360}, 100%, 75%, ${0.7 * aeon.glow})`;
    ctx.fill();

    ctx.restore();
  }

  function drawMonitorRift(now) {
    const seamX = 1360; // your physical boundary

    const pulse = 0.5 + 0.5 * Math.sin(now * 0.002);
    const width = 6 + pulse * 10;

    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    const grad = ctx.createLinearGradient(seamX - width, 0, seamX + width, 0);
    grad.addColorStop(0, 'rgba(0,255,200,0)');
    grad.addColorStop(0.5, `rgba(0,255,200,${0.25 * pulse})`);
    grad.addColorStop(1, 'rgba(0,255,200,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(seamX - width, 0, width * 2, H);
    ctx.restore();
  }

  function drawAfterimage(now) {
    if (aeon.excitement < 0.4) return;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.12 * aeon.excitement;

    const offset = 15 * aeon.excitement;
    ctx.drawImage(canvas, -offset, 0);
    ctx.drawImage(canvas, offset, 0);

    ctx.restore();
  }
  // ============================================================================
  // MAIN RENDER & TICK
  // ============================================================================

  let lastTime = performance.now();

  function render(now) {
    const breath = 1 + 0.01 * Math.sin(now * 0.0008);
    ctx.setTransform(breath, 0, 0, breath, W*(1-breath)/2, H*(1-breath)/2);
  
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  
    // ---------------------------------------------------------
    // 1. BACKGROUND: Starfield (AFTER transform, BEFORE creature)
    // ---------------------------------------------------------
    ctx.save();
    ctx.globalAlpha = 0.15;
    ctx.fillStyle = 'white';
    for (const s of stars) {
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  
    // ---------------------------------------------------------
    // 2. CREATURE BASE BODY
    // ---------------------------------------------------------
    drawSwirlingManifold(ctx, aeon, now);
  
    // ---------------------------------------------------------
    // 3. COLOR DRIFT OVERLAY
    // ---------------------------------------------------------
    ctx.save();
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = 0.04;
    const drift = ctx.createLinearGradient(0,0,W,0);
    drift.addColorStop(0, `hsl(${(now*0.01)%360},100%,50%)`);
    drift.addColorStop(1, `hsl(${(now*0.01+90)%360},100%,50%)`);
    ctx.fillStyle = drift;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  
    // ---------------------------------------------------------
    // 4. VIGNETTE
    // ---------------------------------------------------------
    const vignetteGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.9);
    vignetteGrad.addColorStop(0, 'rgba(0,0,0,0)');
    vignetteGrad.addColorStop(1, 'rgba(0,0,0,0.25)');
    ctx.fillStyle = vignetteGrad;
    ctx.fillRect(0, 0, W, H);
  
    // ---------------------------------------------------------
    // 5. CREATURE DETAIL LAYERS
    // ---------------------------------------------------------
    drawTail(now);
    drawElectricSheepBody(now);
    drawReflectiveAura(now);
  
    // ---------------------------------------------------------
    // 6. GLYPHS
    // ---------------------------------------------------------
    for (const glyph of glyphs) {
      glyph.draw(ctx);
    }
  
    // ---------------------------------------------------------
    // 7. TOP EFFECTS
    // ---------------------------------------------------------
    drawTemporalAliasingEffect(now);
    drawScreenBands(now);
    drawMonitorRift(now);
    drawAfterimage(now);
  
    if (Math.random() < 0.005 && aeon.excitement > 0.3) {
      drawCrackedGlassPrism(
        rand(100, W - 100),
        rand(100, H - 100),
        rand(40, 120)
      );
    }
  
    ctx.setTransform(1,0,0,1,0,0);
  }

  function tick(now) {
    const dtMs = now - lastTime;
    const dt = clamp(dtMs / 1000, 0, 0.06);
    lastTime = now;

    update(dt, dtMs, now);
    render(now);
    const FPS = 40;
    setTimeout(() => requestAnimationFrame(tick), 1000 / FPS);
  }

  requestAnimationFrame(tick);

  // ============================================================================
  // KEYBOARD CONTROLS (debug/browser only)
  // ============================================================================

  window.addEventListener('keydown', e => {
    if (e.key === '1') aeon.mode = 'edge';
    if (e.key === '2') aeon.mode = 'wander';
    if (e.key === '3') aeon.mode = 'geometry';
    if (e.key === 'g' || e.key === 'G') {
      const idx = geomModes.indexOf(aeon.geomMode);
      aeon.geomMode = geomModes[(idx + 1) % geomModes.length];
    }
    if (e.key === 'h' || e.key === 'H') {
      const hud = document.getElementById('hud');
      hud.style.display = hud.style.display === 'none' ? 'block' : 'none';
    }
  });
  </script>
</body>
</html>
