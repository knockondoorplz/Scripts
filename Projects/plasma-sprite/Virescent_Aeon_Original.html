<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Virescent Aeon — Algebraic Glyph Familiar</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      /* Transparent for Electron overlay; in a normal browser this will show page bg */
      background: transparent;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    /* Optional tiny HUD you can toggle with H */
    #hud {
      position: fixed;
      right: 10px;
      top: 8px;
      padding: 4px 7px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 11px;
      color: rgba(220, 234, 255, 0.8);
      background: linear-gradient(180deg, rgba(8,10,18,0.78), rgba(6,8,16,0.55));
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(7px);
      pointer-events: none;
      z-index: 10;
      user-select: none;
    }
  </style>
</head>
<body>
  <canvas id="aeon"></canvas>
  <div id="hud">Aeon: edge · ℵ geometry · idle
  <br/>[1] edge  [2] wander  [3] geometry  [G] cycle geometry  [H] hide HUD</div>

  <script>
  // Virescent Aeon — a next-gen organism meant for an always-on-top, click-through Electron overlay.
  // It fuses:
  // - algebraic / parametric motion (lemniscates, Lissajous, spirals)
  // - glyph exhaust (exotic runes as particles)
  // - temporal aliasing + teleport ghosting
  // - edge patrol + idle geometry rituals

  const canvas = document.getElementById('aeon');
  const ctx = canvas.getContext('2d', { alpha: true });

  let W = window.innerWidth;
  let H = window.innerHeight;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- UTIL ----------
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;

  // ---------- RUNES / SYMBOLS ----------
  // Master glyph set from the Algebraic / Holographic prototype.
  // You can override this at runtime by defining window.AEON_GLYPHS = [...].
  const MASTER_GLYPHS = (window.AEON_GLYPHS && Array.isArray(window.AEON_GLYPHS) && window.AEON_GLYPHS.length)
    ? window.AEON_GLYPHS
    : ["ᚠ","ᚢ","ᚦ","ᚨ","ᚱ","ᚲ","ᚹ","ᛉ","ᛋ","ᛏ","ᛒ","ᛗ","ᛟ","ᛞ","ᛝ","᚛","᚜","۞","₪","✧","ᚾ","߷","౨","ᔑ","ﺝ","ﬡ","ꭍ","Ω","Σ","Ⰹ","Ⱑ","Ⰿ","Ⰴ","-","+","÷","x","z","!","?","0","1","%","#","°","æ","ƹ","ƨ","ʊ","ɔ","ə","ʢ","ʺ","Ω","Δ","Φ","Ψ","π","ҩ","Պ","Հ","Ձ","Ճ","Յ","Չ","Պ ֟  ל","ᴕ","ע","פ","ץ","צ"," ","ᵹ","ᵶ","‽","ꬽ","ꭅ","ꭥ","Ꝍ","ꝏ","ꝋ","ꝕ","Ꝏ","j","xy","n","∂","↓","∞","√","∙","∫","≠","≡","☼","▼","▲","☺","☻","►","◄","◌","ⱼ","⸗","ꜟ","Ꜣ","ꜣ","ꜫ","ꝫ","Ꝧ","ꝛ","ꝰ","ꝸ","Ᵹ","Ꝿ","ꞇ","ꞓ","◊","ﮊ","ﭐ","ﭒ","ﮥ","ﮭ","ﮪ","﮸","ﻁ","ﻞ","ﻍ","ﻜ","ﻡ","ﻥ","ﻩ","ﯓ","ﯕ","ﷴ","ﯱ","ﻱ","﴿  ﴾ ","ꭃ","ꭋ"];
  const RUNES = MASTER_GLYPHS;
  const pickRune = () => RUNES[Math.floor(Math.random() * RUNES.length)];

  // ---------- MOUSE ----------
  const mouse = { x: W/2, y: H/2, lastMove: 0, deltaX: 0, deltaY: 0, seen: false };
  window.addEventListener('pointermove', e => {
    const oldX = mouse.x;
    const oldY = mouse.y;
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.deltaX = mouse.x - oldX;
    mouse.deltaY = mouse.y - oldY;
    mouse.lastMove = performance.now();
    mouse.seen = true;
  });

  // ---------- GLYPH PARTICLES ----------
  const glyphs = [];

  class GlyphParticle {
    constructor(x, y, baseHue) {
      this.x = x;
      this.y = y;
      this.vx = rand(-0.6, 0.6);
      this.vy = rand(-0.6, 0.6);
      this.life = rand(600, 1400); // ms
      this.age = 0;
      this.rune = pickRune();
      this.spin = rand(0, TAU);
      this.baseHue = baseHue;
      this.size = rand(11, 18);
    }
    update(dt) {
      this.age += dt;
      const t = this.age / this.life;
      if (t >= 1) return false;
      this.spin += dt * 0.004;
      this.x += this.vx * (1 - t * 0.4);
      this.y += this.vy * (1 - t * 0.4);
      // slight drift outward
      this.vx += Math.cos(this.spin) * 0.01;
      this.vy += Math.sin(this.spin) * 0.01;
      return true;
    }
    draw(ctx) {
      const t = this.age / this.life;
      const alpha = (1 - t) * 0.9;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(Math.sin(this.spin) * 0.7);
      ctx.font = `${this.size}px "Noto Sans Symbols 2", system-ui, serif`;
      ctx.fillStyle = `hsla(${this.baseHue + Math.sin(this.spin)*20}, 90%, ${65 - t*25}%, ${alpha})`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(this.rune, 0, 0);
      ctx.restore();
    }
  }

  // ---------- TELEPORT / MIRROR GHOST ----------
  let teleportTimer = 0; // ms

  function triggerTeleport() {
    teleportTimer = rand(120, 260); // short glitch
  }

  function drawTeleportGhost(nowMs) {
    if (teleportTimer <= 0) return;
    const t = clamp(teleportTimer / 260, 0, 1);
    const alpha = t * 0.22;
    const sx = W * 0.5 - 140,
          sy = H * 0.5 - 110,
          sw = 280,
          sh = 220;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.globalCompositeOperation = 'lighter';
    // simple mirrored tile from centre region
    try {
      ctx.drawImage(canvas, sx, sy, sw, sh, W - sx - sw, H - sy - sh, sw, sh);
    } catch (e) {
      // ignore if offscreen
    }
    ctx.restore();
  }

  // ---------- CORE ORGANISM ----------
  const aeon = {
    x: W * 0.6,
    y: H * 0.4,
    vx: 0,
    vy: 0,
    tail: [],
    tailLen: 28,
    glow: 1,
    mode: 'edge', // 'edge' | 'wander' | 'geometry'
    geomMode: 'lemniscate', // 'lemniscate' | 'lissajous' | 'spiral' | 'orbit'
    mood: 'curious',
    baseHue: 190,
    lastRuneSwap: 0,
    rune: pickRune(),
    flashSeq: [],
    flashStart: 0,
    dashing: false,
    lastDash: 0,
    idlePhase: 0,
  };

  const geomModes = ['lemniscate','lissajous','spiral','orbit'];

  function setMode(mode) {
    aeon.mode = mode;
    flashRunes(4);
  }

  function cycleGeom() {
    const idx = geomModes.indexOf(aeon.geomMode);
    aeon.geomMode = geomModes[(idx + 1) % geomModes.length];
    flashRunes(3);
  }

  function flashRunes(n) {
    const seq = [];
    for (let i = 0; i < n; i++) seq.push({ r: pickRune(), t: 60 + i * 40 });
    aeon.flashSeq = seq;
    aeon.flashStart = performance.now();
  }

  function dashToward(px, py) {
    aeon.dashing = true;
    aeon.lastDash = performance.now();
    const dx = px - aeon.x;
    const dy = py - aeon.y;
    const dist = Math.hypot(dx, dy) || 1;
    const speed = 750;
    aeon.vx = (dx / dist) * speed;
    aeon.vy = (dy / dist) * speed;
    flashRunes(5);
    triggerTeleport();
  }

  // ---------- GEOMETRY TARGETS ----------
  function geomPoint(mode, t, region) {
    const cx = region ? (region.x + region.w/2) : W/2;
    const cy = region ? (region.y + region.h/2) : H/2;
    if (mode === 'lemniscate') {
      // figure-eight / infinity lemniscate
      const a = Math.sin(t * 0.8);
      const b = Math.cos(t * 0.8);
      const scale = Math.min(W, H) * 0.18;
      return {
        x: cx + scale * (a) / (1 + b*b),
        y: cy + scale * (a * b) / (1 + b*b)
      };
    }
    if (mode === 'lissajous') {
      const A = Math.min(W, H) * 0.26;
      const a = 3, b = 2, d = Math.PI / 2.4;
      return {
        x: cx + A * Math.sin(a * t * 0.6 + d),
        y: cy + A * Math.sin(b * t * 0.6)
      };
    }
    if (mode === 'spiral') {
      const s = t * 0.12;
      const r = (40 + s * 220) % (Math.min(W, H) * 0.45);
      const ang = s * 2.8;
      return { x: cx + Math.cos(ang)*r, y: cy + Math.sin(ang)*r };
    }
    // orbit: small circle around cursor or center
    const R = Math.min(W, H) * 0.18;
    const ang = t * 0.9;
    const ox = mouse.seen ? mouse.x : cx;
    const oy = mouse.seen ? mouse.y : cy;
    return { x: ox + Math.cos(ang)*R, y: oy + Math.sin(ang)*R*0.7 };
  }

  // ---------- EDGE PATROL RECT ----------
  function screenRect(pad = 40) {
    return { x: pad, y: pad, w: W - pad*2, h: H - pad*2 };
  }

  function perimeterPoint(rect, tNorm) {
    const { x, y, w, h } = rect;
    const per = 2*(w + h);
    let d = tNorm * per;
    if (d < w) return { x: x + d, y: y };
    d -= w;
    if (d < h) return { x: x + w, y: y + d };
    d -= h;
    if (d < w) return { x: x + w - d, y: y + h };
    d -= w;
    return { x: x, y: y + h - d };
  }

  // ---------- MAIN UPDATE/DRAW ----------
  let lastTime = performance.now();

  function tick(now) {
    const dtMs = now - lastTime;
    const dt = clamp(dtMs / 1000, 0, 0.07);
    lastTime = now;

    update(dt, dtMs, now);
    render(now);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function update(dt, dtMs, now) {
    // idle detection
    const idle = (now - mouse.lastMove) > 3500;
    if (idle) aeon.idlePhase += dt; else aeon.idlePhase = Math.max(0, aeon.idlePhase - dt*0.8);

    // occasional automatic geometry ritual when idle
    if (idle && aeon.mode !== 'geometry' && Math.random() < 0.002) {
      setMode('geometry');
      cycleGeom();
    }
    // occasional return to edge when user moves again
    if (!idle && aeon.mode === 'geometry' && Math.random() < 0.004) {
      setMode('edge');
    }

    // choose target point
    let target = null;

    if (aeon.mode === 'edge') {
      const rect = screenRect(40 + Math.sin(now*0.0003)*10);
      const tNorm = (now*0.00012 * (1.3 + aeon.idlePhase*0.8)) % 1;
      target = perimeterPoint(rect, tNorm);
    } else if (aeon.mode === 'wander') {
      if (!aeon._wanderTarget || Math.random() < 0.01) {
        aeon._wanderTarget = {
          x: rand(W*0.15, W*0.85),
          y: rand(H*0.18, H*0.82),
        };
      }
      target = aeon._wanderTarget;
    } else if (aeon.mode === 'geometry') {
      target = geomPoint(aeon.geomMode, now*0.0014, null);
    }

    // react to cursor when close
    if (mouse.seen) {
      const d = Math.hypot(aeon.x - mouse.x, aeon.y - mouse.y);
      if (d < 120 && !aeon.dashing) {
        const peekBehind = {
          x: mouse.x - mouse.deltaX * 5,
          y: mouse.y - mouse.deltaY * 5,
        };
        target = peekBehind;
      }
      // rare dash when user moves abruptly
      if (!aeon.dashing && d > 220 && Math.hypot(mouse.deltaX, mouse.deltaY) > 30 && Math.random() < 0.02) {
        dashToward(mouse.x, mouse.y);
      }
    }

    // decay dash
    if (aeon.dashing && now - aeon.lastDash > 280) aeon.dashing = false;

    // velocity integration
    if (target) {
      const dx = target.x - aeon.x;
      const dy = target.y - aeon.y;
      const dist = Math.hypot(dx, dy) || 1;
      const speedBase = 260;
      const speed = speedBase * (aeon.dashing ? 3.2 : 1.0) * (1 + aeon.idlePhase*0.4);
      const desiredVx = (dx / dist) * speed;
      const desiredVy = (dy / dist) * speed;
      const mix = clamp(6 * dt * (1 + aeon.idlePhase*0.4), 0.06, 0.9);
      aeon.vx = lerp(aeon.vx, desiredVx, mix);
      aeon.vy = lerp(aeon.vy, desiredVy, mix);
    } else {
      aeon.vx = lerp(aeon.vx, rand(-40,40), 0.02);
      aeon.vy = lerp(aeon.vy, rand(-40,40), 0.02);
    }

    aeon.x += aeon.vx * dt;
    aeon.y += aeon.vy * dt;

    // keep loosely inside
    if (aeon.x < 20) aeon.x = 20;
    if (aeon.x > W-20) aeon.x = W-20;
    if (aeon.y < 20) aeon.y = 20;
    if (aeon.y > H-20) aeon.y = H-20;

    // glow dynamics
    const targetGlow = aeon.dashing ? 2.4 : (idle ? 1.3 : 0.9);
    aeon.glow = lerp(aeon.glow, targetGlow, dt * 4.0);

    // tail
    aeon.tail.unshift({ x: aeon.x, y: aeon.y, t: now });
    while (aeon.tail.length > aeon.tailLen) aeon.tail.pop();

    // spawn glyph exhaust
    if (Math.random() < 0.22) {
      glyphs.push(new GlyphParticle(aeon.x, aeon.y, aeon.baseHue));
    }
    if (aeon.dashing && Math.random() < 0.5) {
      glyphs.push(new GlyphParticle(aeon.x, aeon.y, aeon.baseHue + 40));
    }

    // glyph updates
    for (let i = glyphs.length - 1; i >= 0; i--) {
      const alive = glyphs[i].update(dtMs);
      if (!alive) glyphs.splice(i, 1);
    }

    // rune flash sequence
    if (aeon.flashSeq.length) {
      const elapsed = now - aeon.flashStart;
      let acc = 0, active = null;
      for (const s of aeon.flashSeq) {
        acc += s.t;
        if (elapsed < acc) { active = s.r; break; }
      }
      if (active) aeon.rune = active; else aeon.flashSeq = [];
    } else if (now - aeon.lastRuneSwap > 900 + Math.random()*1100) {
      aeon.rune = pickRune();
      aeon.lastRuneSwap = now;
    }

    // teleport decay
    if (teleportTimer > 0) teleportTimer -= dtMs;
  }

  function render(now) {
    ctx.clearRect(0, 0, W, H);

    // subtle vignette for when used standalone in a browser (in overlay it's mostly invisible)
    const g = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.8);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    // idle shimmer bands (temporal aliasing)
    if (aeon.idlePhase > 0.2 && Math.random() < 0.4) {
      const bandAlpha = 0.015 * aeon.idlePhase;
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      for (let i=0;i<3;i++) {
        const y = (now*0.09 + i*110) % H;
        const hBand = 8 + i*3;
        ctx.fillStyle = `rgba(170,220,255,${bandAlpha})`;
        ctx.fillRect(0, y, W, hBand);
      }
      ctx.restore();
    }

    // edge hint rectangle
    if (aeon.mode === 'edge') {
      const rect = screenRect(40 + Math.sin(now*0.0003)*10);
      ctx.save();
      ctx.strokeStyle = 'rgba(150, 210, 255, 0.18)';
      ctx.lineWidth = 1.2;
      ctx.setLineDash([6, 10]);
      roundRect(ctx, rect.x, rect.y, rect.w, rect.h, 14);
      ctx.stroke();
      ctx.restore();
    }

    // tail
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < aeon.tail.length; i++) {
      const p = aeon.tail[i];
      const age = (now - p.t) / 1000;
      const fade = clamp(1 - (i/aeon.tail.length) - age*0.4, 0, 1);
      if (fade <= 0) continue;
      const hue = aeon.baseHue + i*1.8 + Math.sin((i/4)+now/900)*8;
      const alpha = 0.12 * fade * aeon.glow;
      ctx.fillStyle = `hsla(${hue}, 92%, ${42 + fade*18}%, ${alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 9 + i*0.7, 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    // aura / body — layered plasma knot
    const baseR = 26 + aeon.glow * 7;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    // outer soft aura
    let grd = ctx.createRadialGradient(aeon.x, aeon.y, 0, aeon.x, aeon.y, baseR*3.2);
    grd.addColorStop(0, `hsla(${aeon.baseHue}, 96%, 92%, ${0.75*aeon.glow})`);
    grd.addColorStop(0.3, `hsla(${aeon.baseHue-10}, 90%, 70%, ${0.3*aeon.glow})`);
    grd.addColorStop(1, `hsla(${aeon.baseHue-40}, 70%, 30%, ${0.05*aeon.glow})`);
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(aeon.x, aeon.y, baseR*1.8, 0, TAU);
    ctx.fill();

    // inner noisy manifold (holographic-style wobble)
    ctx.beginPath();
    for (let i=0;i<120;i++) {
      const a = (i/120) * TAU;
      const n = Math.sin(a*3 + now*0.0016) * 0.4 + Math.sin(a*7 - now*0.0011) * 0.25;
      const r = baseR * (1 + n*0.6);
      const px = aeon.x + Math.cos(a)*r;
      const py = aeon.y + Math.sin(a)*r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = `hsla(${aeon.baseHue+8}, 90%, 65%, ${0.45*aeon.glow})`;
    ctx.fill();

    // filaments
    for (let s=0; s<5; s++) {
      ctx.beginPath();
      ctx.moveTo(aeon.x, aeon.y);
      for (let k=0; k<5; k++) {
        const a = k/5*TAU + s*0.9;
        const rx = aeon.x + Math.cos(a + now/420 + s)*(7 + k*1.3);
        const ry = aeon.y + Math.sin(a + now/420 + s)*(7 + k*1.0);
        ctx.lineTo(rx, ry);
      }
      ctx.strokeStyle = `hsla(${aeon.baseHue + s*8}, 98%, ${60 - s*4}%, ${0.08*aeon.glow})`;
      ctx.lineWidth = 1.1 - s*0.13;
      ctx.stroke();
    }

    // core comma / glyph
    ctx.font = '30px "Noto Sans Symbols 2", system-ui, serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = `rgba(255,255,255,${0.98*aeon.glow})`;
    ctx.fillText(aeon.rune, aeon.x + aeon.vx*0.004, aeon.y + aeon.vy*0.004);

    // satellite runes when excited
    if (aeon.dashing || aeon.flashSeq.length) {
      for (let i=0;i<3;i++) {
        const a = (now/200) + i*2.1;
        const ox = aeon.x + Math.cos(a)*(26 + i*8);
        const oy = aeon.y + Math.sin(a)*(18 + i*6);
        ctx.font = `${13 + i*2}px system-ui`;
        ctx.fillStyle = `hsla(${aeon.baseHue + i*22}, 96%, 72%, ${0.86 - i*0.22})`;
        ctx.fillText(RUNES[(i + Math.floor(now/150)) % RUNES.length], ox, oy);
      }
    }
    ctx.restore();

    // glyph particles
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const gPart of glyphs) gPart.draw(ctx);
    ctx.restore();

    // teleport ghost overlay
    drawTeleportGhost(now);
  }

  function roundRect(ctx, x, y, w, h, r) {
    const rr = typeof r === 'number' ? {tl:r,tr:r,br:r,bl:r} : r;
    ctx.beginPath();
    ctx.moveTo(x + rr.tl, y);
    ctx.lineTo(x + w - rr.tr, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + rr.tr);
    ctx.lineTo(x + w, y + h - rr.br);
    ctx.quadraticCurveTo(x + w, y + h, x + w - rr.br, y + h);
    ctx.lineTo(x + rr.bl, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - rr.bl);
    ctx.lineTo(x, y + rr.tl);
    ctx.quadraticCurveTo(x, y, x + rr.tl, y);
    ctx.closePath();
  }

  // ---------- KEYBOARD CONTROLS ----------
  const hudEl = document.getElementById('hud');
  let hudVisible = true;

  function refreshHud() {
    if (!hudVisible) { hudEl.style.display = 'none'; return; }
    hudEl.style.display = 'block';
    hudEl.innerHTML = `Aeon: <b>${aeon.mode}</b> · ${aeon.geomMode}<br/>[1] edge  [2] wander  [3] geometry  [G] cycle geometry  [H] hide HUD`;
  }
  refreshHud();

  window.addEventListener('keydown', (e) => {
    if (e.key === '1') { setMode('edge'); refreshHud(); }
    else if (e.key === '2') { setMode('wander'); refreshHud(); }
    else if (e.key === '3') { setMode('geometry'); refreshHud(); }
    else if (e.key.toLowerCase() === 'g') { cycleGeom(); refreshHud(); }
    else if (e.key.toLowerCase() === 'h') { hudVisible = !hudVisible; refreshHud(); }
  });
  </script>
</body>
</html>
