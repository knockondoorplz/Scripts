<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Virescent Aeon — Algebraic Glyph Familiar</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      /* Transparent for Electron overlay; in a normal browser this will show page bg */
      background: transparent;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    /* Optional tiny HUD you can toggle with H */
    #hud {
      position: fixed;
      right: 10px;
      top: 8px;
      padding: 4px 7px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 11px;
      color: rgba(220, 234, 255, 0.8);
      background: linear-gradient(180deg, rgba(8,10,18,0.78), rgba(6,8,16,0.55));
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(7px);
      pointer-events: none;
      z-index: 10;
      user-select: none;
    }
  </style>
</head>
<body>
  <canvas id="aeon"></canvas>
  <div id="hud">Aeon: edge · ℵ geometry · idle
  <br/>[1] edge  [2] wander  [3] geometry  [G] cycle geometry  [H] hide HUD</div>

  <script>
  // Virescent Aeon — a next-gen organism meant for an always-on-top, click-through Electron overlay.
  // It fuses:
  // - algebraic / parametric motion (lemniscates, Lissajous, spirals)
  // - glyph exhaust (exotic runes as particles)
  // - temporal aliasing + teleport ghosting
  // - edge patrol + idle geometry rituals

  const canvas = document.getElementById('aeon');
  const ctx = canvas.getContext('2d', { alpha: true });

  let W = window.innerWidth;
  let H = window.innerHeight;

  // Dual-screen support and enhanced behaviors

  // Adjust canvas size to span dual screens
  function resize() {
    const screens = window.screen;
    W = screens.width; // Total width across both screens
    H = screens.height; // Maximum height of the screens
    const dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // Enhanced behaviors for lifelike actions
  function update(dt, dtMs, now) {
    const idle = mouse.seen && (now - mouse.lastMove) > 8000;
    if (idle) aeon.idlePhase += dt; else aeon.idlePhase = Math.max(0, aeon.idlePhase - dt * 0.8);

    let target = null;

    if (aeon.mode === 'edge') {
      const rect = screenRect(40 + Math.sin(now * 0.00025) * 10);
      const tNorm = (now * 0.00004 * (1.1 + aeon.idlePhase * 0.4)) % 1;
      target = perimeterPoint(rect, tNorm);
    } else if (aeon.mode === 'wander') {
      if (!aeon._wanderTarget || Math.random() < 0.01) {
        aeon._wanderTarget = {
          x: rand(W * 0.15, W * 0.85),
          y: rand(H * 0.18, H * 0.82),
        };
      }
      target = aeon._wanderTarget;
    } else if (aeon.mode === 'geometry') {
      target = geomPoint(aeon.geomMode, now * 0.0006, null);
    }

    if (mouse.seen) {
      const d = Math.hypot(aeon.x - mouse.x, aeon.y - mouse.y);
      if (d < 120 && !aeon.dashing) {
        const peekBehind = {
          x: mouse.x - mouse.deltaX * 5,
          y: mouse.y - mouse.deltaY * 5,
        };
        target = peekBehind;
      }
      if (!aeon.dashing && d > 220 && Math.hypot(mouse.deltaX, mouse.deltaY) > 30 && Math.random() < 0.02) {
        dashToward(mouse.x, mouse.y);
      }
    }

    if (aeon.dashing && now - aeon.lastDash > 320) aeon.dashing = false;

    if (target) {
      const dx = target.x - aeon.x;
      const dy = target.y - aeon.y;
      const dist = Math.hypot(dx, dy) || 1;
      const speedBase = 80; // Slower base speed
      const speed = speedBase * (aeon.dashing ? 1.5 : 1.0) * (1 + aeon.idlePhase * 0.3);
      const desiredVx = (dx / dist) * speed;
      const desiredVy = (dy / dist) * speed;
      const mix = clamp(3 * dt * (1 + aeon.idlePhase * 0.3), 0.04, 0.6);
      aeon.vx = lerp(aeon.vx, desiredVx, mix);
      aeon.vy = lerp(aeon.vy, desiredVy, mix);
    } else {
      aeon.vx = lerp(aeon.vx, rand(-20, 20), 0.02);
      aeon.vy = lerp(aeon.vy, rand(-20, 20), 0.02);
    }

    aeon.x += aeon.vx * dt;
    aeon.y += aeon.vy * dt;

    // Allow sprite to duck behind or above screens
    if (aeon.x < -50) aeon.x = W + 50; // Wrap around horizontally
    if (aeon.x > W + 50) aeon.x = -50;
    if (aeon.y < -50) aeon.y = H + 50; // Wrap around vertically
    if (aeon.y > H + 50) aeon.y = -50;

    const targetGlow = aeon.dashing ? 2.4 : (idle ? 1.3 : 0.9);
    aeon.glow = lerp(aeon.glow, targetGlow, dt * 4.0);

    aeon.tail.unshift({ x: aeon.x, y: aeon.y, t: now });
    while (aeon.tail.length > aeon.tailLen) aeon.tail.pop();

    for (let i = glyphs.length - 1; i >= 0; i--) {
      const alive = glyphs[i].update(dtMs);
      if (!alive) glyphs.splice(i, 1);
    }
  }

  // Ensure dual-screen support and lifelike behaviors
  function dualScreenBehavior() {
    const centerX = W / 2;
    const centerY = H / 2;
    aeon.x = centerX;
    aeon.y = centerY;
    aeon.vx = 0;
    aeon.vy = -50; // Slowly climb upwards
  }

  if (Math.random() < 0.002) {
    dualScreenBehavior();
  }

  // ---------- UTIL ----------
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;

  // ---------- RUNES / SYMBOLS ----------
  // Master glyph set from the Algebraic / Holographic prototype.
  // You can override this at runtime by defining window.AEON_GLYPHS = [...].
  const MASTER_GLYPHS = (window.AEON_GLYPHS && Array.isArray(window.AEON_GLYPHS) && window.AEON_GLYPHS.length)
    ? window.AEON_GLYPHS
    : ["ᚠ","ᚢ","ᚦ","ᚨ","ᚱ","ᚲ","ᚹ","ᛉ","ᛋ","ᛏ","ᛒ","ᛗ","ᛟ","ᛞ","ᛝ","᚛","᚜","۞","₪","✧","ᚾ","߷","౨","ᔑ","ﺝ","ﬡ","ꭍ","Ω","Σ","Ⰹ","Ⱑ","Ⰿ","Ⰴ","-","+","÷","x","z","!","?","0","1","%","#","°","æ","ƹ","ƨ","ʊ","ɔ","ə","ʢ","ʺ","Ω","Δ","Φ","Ψ","π","ҩ","Պ","Հ","Ձ","Ճ","Չ","Պ","ל","ᴕ","ע","פ","ץ","צ","ᵹ","ᵶ","‽","ꬽ","ꭅ","ꭥ","ꝋ","j","xy","n","∂","↓","∞","√","∙","∫","≠","≡","☼","▼","▲","☺","☻","►","◄","◌","ⱼ","⸗","ꜟ","Ꜣ","ꜣ","ꜫ","ꝫ","Ꝧ","ꝛ","ꝰ","ꝸ","Ᵹ","Ꝿ","ꞇ","ꞓ","◊","ﮊ","ﭐ","ﭒ","ﮥ","ﮭ","ﮪ","﮸","ﻁ","ﻞ","ﻍ","ﻜ","ﻡ","ﻥ","ﻩ","ﯓ","ﯕ","ﷴ","ﯱ","ﻱ","﴿","﴾","ꭋ"];
  const RUNES = MASTER_GLYPHS;
  const pickRune = () => RUNES[Math.floor(Math.random() * RUNES.length)];

  // ---------- MOUSE ----------
  const mouse = { x: W/2, y: H/2, lastMove: 0, deltaX: 0, deltaY: 0, seen: false };
  window.addEventListener('pointermove', e => {
    const oldX = mouse.x;
    const oldY = mouse.y;
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.deltaX = mouse.x - oldX;
    mouse.deltaY = mouse.y - oldY;
    mouse.lastMove = performance.now();
    mouse.seen = true;
  });

  // ---------- GLYPH PARTICLES ----------
  const glyphs = [];

  class GlyphParticle {
    constructor(x, y, baseHue) {
      this.x = x;
      this.y = y;
      this.vx = rand(-0.6, 0.6);
      this.vy = rand(-0.6, 0.6);
      this.life = rand(600, 1400); // ms
      this.age = 0;
      this.rune = pickRune();
      this.spin = rand(0, TAU);
      this.baseHue = baseHue;
      this.size = rand(11, 18);
    }
    update(dt) {
      this.age += dt;
      const t = this.age / this.life;
      if (t >= 1) return false;
      this.spin += dt * 0.004;
      this.x += this.vx * (1 - t * 0.4);
      this.y += this.vy * (1 - t * 0.4);
      // slight drift outward
      this.vx += Math.cos(this.spin) * 0.01;
      this.vy += Math.sin(this.spin) * 0.01;
      return true;
    }
    draw(ctx) {
      const t = this.age / this.life;
      const alpha = (1 - t) * 0.9;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(Math.sin(this.spin) * 0.7);
      ctx.font = `${this.size}px "Noto Sans Symbols 2", system-ui, serif`;
      ctx.fillStyle = `hsla(${this.baseHue + Math.sin(this.spin)*20}, 90%, ${65 - t*25}%, ${alpha})`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(this.rune, 0, 0);
      ctx.restore();
    }
  }

  // ---------- TELEPORT / MIRROR GHOST ----------
  let teleportTimer = 0; // ms

  function triggerTeleport() {
    teleportTimer = rand(120, 260); // short glitch
  }

  function drawTeleportGhost(nowMs) {
    if (teleportTimer <= 0) return;
    const t = clamp(teleportTimer / 260, 0, 1);
    const alpha = t * 0.22;
    const sx = W * 0.5 - 140,
          sy = H * 0.5 - 110,
          sw = 280,
          sh = 220;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.globalCompositeOperation = 'lighter';
    // simple mirrored tile from centre region
    try {
      ctx.drawImage(canvas, sx, sy, sw, sh, W - sx - sw, H - sy - sh, sw, sh);
    } catch (e) {
      // ignore if offscreen
    }
    ctx.restore();
  }

  // ---------- CORE ORGANISM ----------
  const aeon = {
    x: W * 0.6,
    y: H * 0.4,
    vx: 0,
    vy: 0,
    tail: [],
    tailLen: 28,
    glow: 1,
    mode: 'edge', // 'edge' | 'wander' | 'geometry'
    geomMode: 'lemniscate', // 'lemniscate' | 'lissajous' | 'spiral' | 'orbit'
    mood: 'curious',
    baseHue: 190,
    lastRuneSwap: 0,
    rune: pickRune(),
    flashSeq: [],
    flashStart: 0,
    dashing: false,
    lastDash: 0,
    idlePhase: 0,
  };

  const geomModes = ['lemniscate','lissajous','spiral','orbit'];

  function setMode(mode) {
    aeon.mode = mode;
    flashRunes(4);
  }

  function cycleGeom() {
    const idx = geomModes.indexOf(aeon.geomMode);
    aeon.geomMode = geomModes[(idx + 1) % geomModes.length];
    flashRunes(3);
  }

  function flashRunes(n) {
    const seq = [];
    for (let i = 0; i < n; i++) seq.push({ r: pickRune(), t: 60 + i * 40 });
    aeon.flashSeq = seq;
    aeon.flashStart = performance.now();
  }

  function dashToward(px, py) {
    aeon.dashing = true;
    aeon.lastDash = performance.now();
    const dx = px - aeon.x;
    const dy = py - aeon.y;
    const dist = Math.hypot(dx, dy) || 1;
    const speed = 520; // still quick, but not frantic
    aeon.vx = (dx / dist) * speed;
    aeon.vy = (dy / dist) * speed;
    flashRunes(5);
    // teleport glitch reserved for special rituals; keep normal dashes clean
    // triggerTeleport();
  }

  // ---------- GEOMETRY TARGETS ----------
  function geomPoint(mode, t, region) {
    const cx = region ? (region.x + region.w/2) : W/2;
    const cy = region ? (region.y + region.h/2) : H/2;
    if (mode === 'lemniscate') {
      // figure-eight / infinity lemniscate
      const a = Math.sin(t * 0.8);
      const b = Math.cos(t * 0.8);
      const scale = Math.min(W, H) * 0.18;
      return {
        x: cx + scale * (a) / (1 + b*b),
        y: cy + scale * (a * b) / (1 + b*b)
      };
    }
    if (mode === 'lissajous') {
      const A = Math.min(W, H) * 0.26;
      const a = 3, b = 2, d = Math.PI / 2.4;
      return {
        x: cx + A * Math.sin(a * t * 0.6 + d),
        y: cy + A * Math.sin(b * t * 0.6)
      };
    }
    if (mode === 'spiral') {
      const s = t * 0.12;
      const r = (40 + s * 220) % (Math.min(W, H) * 0.45);
      const ang = s * 2.8;
      return { x: cx + Math.cos(ang)*r, y: cy + Math.sin(ang)*r };
    }
    // orbit: small circle around cursor or center
    const R = Math.min(W, H) * 0.18;
    const ang = t * 0.9;
    const ox = mouse.seen ? mouse.x : cx;
    const oy = mouse.seen ? mouse.y : cy;
    return { x: ox + Math.cos(ang)*R, y: oy + Math.sin(ang)*R*0.7 };
  }

  // ---------- EDGE PATROL RECT ----------
  function screenRect(pad = 40) {
    return { x: pad, y: pad, w: W - pad*2, h: H - pad*2 };
  }

  function perimeterPoint(rect, tNorm) {
    const { x, y, w, h } = rect;
    const per = 2*(w + h);
    let d = tNorm * per;
    if (d < w) return { x: x + d, y: y };
    d -= w;
    if (d < h) return { x: x + w, y: y + d };
    d -= h;
    if (d < w) return { x: x + w - d, y: y + h };
    d -= w;
    return { x: x, y: y + h - d };
  }

  // ---------- MAIN UPDATE/DRAW ----------
  let lastTime = performance.now();

  function tick(now) {
    const dtMs = now - lastTime;
    const dt = clamp(dtMs / 1000, 0, 0.07);
    lastTime = now;

    update(dt, dtMs, now);
    render(now);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // Refine movement logic to slow down and stabilize the sprite
  function update(dt, dtMs, now) {
    const idle = mouse.seen && (now - mouse.lastMove) > 8000;
    if (idle) aeon.idlePhase += dt; else aeon.idlePhase = Math.max(0, aeon.idlePhase - dt * 0.8);

    let target = null;

    if (aeon.mode === 'edge') {
      const rect = screenRect(40 + Math.sin(now * 0.00025) * 10);
      const tNorm = (now * 0.00004 * (1.1 + aeon.idlePhase * 0.4)) % 1;
      target = perimeterPoint(rect, tNorm);
    } else if (aeon.mode === 'wander') {
      if (!aeon._wanderTarget || Math.random() < 0.01) {
        aeon._wanderTarget = {
          x: rand(W * 0.15, W * 0.85),
          y: rand(H * 0.18, H * 0.82),
        };
      }
      target = aeon._wanderTarget;
    } else if (aeon.mode === 'geometry') {
      target = geomPoint(aeon.geomMode, now * 0.0006, null);
    }

    if (mouse.seen) {
      const d = Math.hypot(aeon.x - mouse.x, aeon.y - mouse.y);
      if (d < 120 && !aeon.dashing) {
        const peekBehind = {
          x: mouse.x - mouse.deltaX * 5,
          y: mouse.y - mouse.deltaY * 5,
        };
        target = peekBehind;
      }
      if (!aeon.dashing && d > 220 && Math.hypot(mouse.deltaX, mouse.deltaY) > 30 && Math.random() < 0.02) {
        dashToward(mouse.x, mouse.y);
      }
    }

    if (aeon.dashing && now - aeon.lastDash > 320) aeon.dashing = false;

    if (target) {
      const dx = target.x - aeon.x;
      const dy = target.y - aeon.y;
      const dist = Math.hypot(dx, dy) || 1;
      const speedBase = 80; // Slower base speed
      const speed = speedBase * (aeon.dashing ? 1.5 : 1.0) * (1 + aeon.idlePhase * 0.3);
      const desiredVx = (dx / dist) * speed;
      const desiredVy = (dy / dist) * speed;
      const mix = clamp(3 * dt * (1 + aeon.idlePhase * 0.3), 0.04, 0.6);
      aeon.vx = lerp(aeon.vx, desiredVx, mix);
      aeon.vy = lerp(aeon.vy, desiredVy, mix);
    } else {
      aeon.vx = lerp(aeon.vx, rand(-20, 20), 0.02);
      aeon.vy = lerp(aeon.vy, rand(-20, 20), 0.02);
    }

    aeon.x += aeon.vx * dt;
    aeon.y += aeon.vy * dt;

    // Allow sprite to duck behind or above screens
    if (aeon.x < -50) aeon.x = W + 50; // Wrap around horizontally
    if (aeon.x > W + 50) aeon.x = -50;
    if (aeon.y < -50) aeon.y = H + 50; // Wrap around vertically
    if (aeon.y > H + 50) aeon.y = -50;

    const targetGlow = aeon.dashing ? 2.4 : (idle ? 1.3 : 0.9);
    aeon.glow = lerp(aeon.glow, targetGlow, dt * 4.0);

    aeon.tail.unshift({ x: aeon.x, y: aeon.y, t: now });
    while (aeon.tail.length > aeon.tailLen) aeon.tail.pop();

    for (let i = glyphs.length - 1; i >= 0; i--) {
      const alive = glyphs[i].update(dtMs);
      if (!alive) glyphs.splice(i, 1);
    }
  }

  // Refine the render loop to ensure all features are displayed
  function render(now) {
    ctx.clearRect(0, 0, W, H);

    // Subtle vignette for standalone browser use
    const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.8);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Render the swirling manifold body
    drawSwirlingManifoldBody();

    // Render the reflective aura
    drawReflectiveAura();

    // Render enhanced particles
    for (const particle of glyphs) {
      particle.draw(ctx);
    }

    // Render cracked-glass prisms randomly
    if (Math.random() < 0.01) {
      triggerCrackedGlassEffect();
    }

    // Remove HUD from the DOM
    const hudEl = document.getElementById('hud');
    if (hudEl) {
      hudEl.remove();
    }
  }

  // Ensure render loop is called
  requestAnimationFrame(tick);

  // ---------- ADDITIONS TO VIRESCENT AEON ----------

  // ---------- CRACKED-GLASS PRISMS AND FRACTAL CRYSTAL PATTERNS ----------
  function drawCrackedGlassPrism(x, y, size, hue) {
    const shards = Math.floor(rand(5, 12));
    for (let i = 0; i < shards; i++) {
      const angle = rand(0, TAU);
      const radius = rand(size * 0.5, size);
      const x1 = x + Math.cos(angle) * radius;
      const y1 = y + Math.sin(angle) * radius;
      const x2 = x + Math.cos(angle + rand(0.1, 0.5)) * radius;
      const y2 = y + Math.sin(angle + rand(0.1, 0.5)) * radius;

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = `hsla(${hue + rand(-20, 20)}, 80%, 70%, ${rand(0.4, 0.8)})`;
      ctx.lineWidth = rand(1, 3);
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
    }
  }

  function triggerCrackedGlassEffect() {
    const x = rand(0, W);
    const y = rand(0, H);
    const size = rand(50, 150);
    const hue = rand(180, 300);
    drawCrackedGlassPrism(x, y, size, hue);
  }

  // Trigger randomly during idle or teleportation
  if (Math.random() < 0.01) {
    triggerCrackedGlassEffect();
  }

  // ---------- EXPANDED GLYPH BEHAVIOR ----------
  const additionalElements = ["🌍", "✨", "⚡", "☀️", "☁️", "🌈", "🔺", "🔷", "🔶", "🌀"];
  const allElements = [...RUNES, ...additionalElements];

  function pickElement() {
    return allElements[Math.floor(Math.random() * allElements.length)];
  }

  class EnhancedParticle {
    constructor(x, y, baseHue) {
      this.x = x;
      this.y = y;
      this.vx = rand(-0.6, 0.6);
      this.vy = rand(-0.6, 0.6);
      this.life = rand(600, 1400);
      this.age = 0;
      this.element = pickElement();
      this.spin = rand(0, TAU);
      this.baseHue = baseHue;
      this.size = rand(11, 18);
    }
    update(dt) {
      this.age += dt;
      const t = this.age / this.life;
      if (t >= 1) return false;
      this.spin += dt * 0.004;
      this.x += this.vx * (1 - t * 0.4);
      this.y += this.vy * (1 - t * 0.4);
      this.vx += Math.cos(this.spin) * 0.01;
      this.vy += Math.sin(this.spin) * 0.01;
      return true;
    }
    draw(ctx) {
      const t = this.age / this.life;
      const alpha = (1 - t) * 0.9;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(Math.sin(this.spin) * 0.7);
      ctx.font = `${this.size}px "Noto Sans Symbols 2", system-ui, serif`;
      ctx.fillStyle = `hsla(${this.baseHue + Math.sin(this.spin)*20}, 90%, ${65 - t*25}%, ${alpha})`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(this.element, 0, 0);
      ctx.restore();
    }
  }

  // Replace glyphs with enhanced particles
  const enhancedParticles = [];
  if (Math.random() < 0.22) {
    enhancedParticles.push(new EnhancedParticle(aeon.x, aeon.y, aeon.baseHue));
  }

  // ---------- REFLECTIVE AND ILLUSORY EFFECTS ----------
  function drawReflectiveAura() {
    const grd = ctx.createRadialGradient(aeon.x, aeon.y, 0, aeon.x, aeon.y, 200);
    grd.addColorStop(0, `rgba(255, 255, 255, 0.2)`);
    grd.addColorStop(1, `rgba(0, 0, 0, 0)`);
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(aeon.x, aeon.y, 200, 0, TAU);
    ctx.fill();
  }

  // Call this in the render loop
  if (Math.random() < 0.1) {
    drawReflectiveAura();
  }

  // ---------- SWIRLING MANIFOLDS BODY ----------
  function drawSwirlingManifoldBody() {
    const baseR = 26 + aeon.glow * 7;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.beginPath();
    for (let i = 0; i < 120; i++) {
      const a = (i / 120) * TAU;
      const n = Math.sin(a * 3 + performance.now() * 0.0016) * 0.4 + Math.sin(a * 7 - performance.now() * 0.0011) * 0.25;
      const r = baseR * (1 + n * 0.6);
      const px = aeon.x + Math.cos(a) * r;
      const py = aeon.y + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = `hsla(${aeon.baseHue + 8}, 90%, 65%, ${0.45 * aeon.glow})`;
    ctx.fill();
    ctx.restore();
  }

  // Call this in the render loop
  if (Math.random() < 0.5) {
    drawSwirlingManifoldBody();
  }

  // ---------- TELEPORTATION ----------
  function teleportSprite() {
    aeon.x = rand(0, W);
    aeon.y = rand(0, H);
    triggerCrackedGlassEffect();
  }

  if (Math.random() < 0.005) {
    teleportSprite();
  }

  // ---------- DUAL-SCREEN INTERACTIONS ----------
  function dualScreenBehavior() {
    const centerX = W / 2;
    const centerY = H / 2;
    aeon.x = centerX;
    aeon.y = centerY;
    aeon.vx = 0;
    aeon.vy = -50; // Slowly climb upwards
  }

  if (Math.random() < 0.002) {
    dualScreenBehavior();
  }

  // ---------- SCREEN-WARPING EFFECTS ----------
  function applyScreenWarp() {
    ctx.save();
    ctx.globalCompositeOperation = 'difference';
    ctx.filter = 'blur(4px)';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
    ctx.fillRect(rand(0, W), rand(0, H), rand(50, 200), rand(50, 200));
    ctx.restore();
  }

  if (Math.random() < 0.01) {
    applyScreenWarp();
  }
  </script>
</body>
</html>
