<!DOCTYPE html
<html lang="en">
<head>
<meta charset="??">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:radial-gradient(circle at 30% 50%, #0a0a1a 0%, #000 100%);
  color:#eaf6ff;
  font-family:'Segoe UI',sans-serif;
}

/* cosmic sky = moving gradient field */
#sky{
  position:fixed;
  width:200%;
  height:200%;
  top:-50%;
  left:-50%;
  background:linear-gradient(135deg,#00eaff40,#8a2be240,#ff00ff20);
  animation:skyMove 40s linear infinite alternate;
  filter:blur(120px) saturate(150%);
  z-index:0;
}

/* glass UI */
.glass-card{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.18);
  border-radius:24px;
  padding:40px 60px;
  backdrop-filter:blur(20px) saturate(180%);
  box-shadow:0 20px 40px rgba(0,0,0,0.35);
  animation:float 8s ease-in-out infinite alternate;
}

.glass-card::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:linear-gradient(120deg,#00eaffaa,#8a2be2aa);
  mix-blend-mode:overlay;
  opacity:0.2;
}

@keyframes skyMove{
  0%{transform:translate(0,0) rotate(0deg);}
  100%{transform:translate(25%,25%) rotate(15deg);}
}

@keyframes float{
  0%{transform:translate(-50%,-52%);}
  100%{transform:translate(-50%,-48%);}
}

/* typography */
h1{font-weight:300;letter-spacing:2px;margin:0;}
p{opacity:0.8;font-size:1.1rem;}
</style>
                 
</head>
<body>
  <div id="sky"></div>
  <div class="glass-card">
    <h1>Jiggatron</h1>
    <p>and we have liftoff</p>
  </div>
</body>
