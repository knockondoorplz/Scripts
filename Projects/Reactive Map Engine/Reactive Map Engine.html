<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reactive Map Engine Prototype</title>
  <style>
    body {
      margin: 0;
      background: #0a0a0a;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
    }

    /* Left side: "map" of whole sequence */
    #map {
      width: 20%;
      background: #111;
      overflow-y: auto;
      padding: 10px;
      border-right: 2px solid #222;
    }

    .map-frame {
      height: 40px;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #222, #444);
      border-radius: 6px;
      transition: transform 0.1s ease;
    }

    .active {
      outline: 2px solid #0ff;
    }

    /* Right side: main viewport */
    #main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    #viewport {
      flex-grow: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #333, #000);
    }

    #shape {
      width: 120px;
      height: 120px;
      background: #0ff;
      border-radius: 50%;
      transition: all 0.2s ease;
    }

    #controls {
      padding: 15px;
      background: #111;
      border-top: 2px solid #222;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="main">
    <div id="viewport">
      <div id="shape"></div>
    </div>

    <div id="controls">
      <label>Size</label>
      <input id="slider" type="range" min="10" max="200" value="120"> 
    </div>
  </div>

<script>
  // Generate a timeline of 200 frames
  const map = document.getElementById('map');
  const shape = document.getElementById('shape');
  const slider = document.getElementById('slider');

  let frames = [];
  for (let i = 0; i < 200; i++) {
    const div = document.createElement('div');
    div.className = 'map-frame';
    div.dataset.index = i;
    map.appendChild(div);
    frames.push(div);

    // Clicking a frame "jumps" to its state
    div.addEventListener('click', () => {
      currentFrame = i;
      updateFromFrame();
    });
  }

  let currentFrame = 0;

  function updateFromFrame() {
    // Reactively update UI based on frame index
    const factor = currentFrame / 200;
    const size = 40 + factor * 160;
    shape.style.width = size + 'px';
    shape.style.height = size + 'px';

    // Highlight active frame
    frames.forEach(f => f.classList.remove('active'));
    frames[currentFrame].classList.add('active');

    // Sync slider
    slider.value = size;
  }

  // Slider dragging generates a state and updates map as a preview
  slider.addEventListener('input', () => {
    const size = Number(slider.value);

    shape.style.width = size + 'px';
    shape.style.height = size + 'px';

    // Compute equivalent frame
    currentFrame = Math.floor(((size - 40) / 160) * 200);
    if (currentFrame < 0) currentFrame = 0;
    if (currentFrame > 199) currentFrame = 199;

    frames.forEach(f => f.classList.remove('active'));
    frames[currentFrame].classList.add('active');
  });

  updateFromFrame();
</script>

</body>
</html>
